services:
  node-red:
    build: ./node-red
    image: pdp-node-red:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:1881:1880"
    environment:
      TZ: Europe/Brussels
    volumes:
      - node_red_data:/data
    entrypoint:
      - /bin/bash
      - -c
      - |
        if [ ! -d /data/node_modules/@flowfuse/node-red-dashboard ]; then
          (cd /data && npm install --no-audit --no-fund --no-update-notifier @flowfuse/node-red-dashboard)
        fi
        exec ./entrypoint.sh

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  python-sensor:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - mosquitto
    environment:
      TZ: Europe/Brussels
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: sensors/ruimte1
    volumes:
      - ./sensor:/app
    command: >
      sh -c "pip install --no-cache-dir paho-mqtt && python -u sensor.py"

volumes:
  node_red_data:
  mosquitto_data:
  mosquitto_log:
