# Voorlopig enkel de Node-RED service. Teamgenoten voegen hun eigen services
# (mosquitto, influxdb, python-sensor) hieronder toe. Ze bereiken elkaar via
# hun servicenaam op het default netwerk, bv. mqtt://mosquitto:1883.
#
# Starten:  docker compose up -d node-red   ->  http://localhost:1881
#
# Eenmalig na een verse start (leeg volume): Menu -> Manage palette ->
# Install -> @flowfuse/node-red-dashboard. Of via de CLI:
#   docker compose exec node-red sh -c "cd /data && npm install @flowfuse/node-red-dashboard"
#   docker compose restart node-red

services:
  node-red:
    image: ghcr.io/node-red/node-red:5.0.9
    restart: unless-stopped
    ports:
      # 1881 zodat je bestaande Node-RED op 1880 blijft werken
      - "127.0.0.1:1881:1880"
    environment:
      TZ: Europe/Brussels
    volumes:
      - node_red_data:/data

volumes:
  node_red_data:
