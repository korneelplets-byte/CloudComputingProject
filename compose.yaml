# Voorlopig enkel de Node-RED service. Teamgenoten voegen hun eigen services
# (mosquitto, influxdb, python-sensor) hieronder toe. Ze bereiken elkaar via
# hun servicenaam op het default netwerk, bv. mqtt://mosquitto:1883.
#
# Starten:    docker compose up -d --build node-red
# Editor:     http://localhost:1881
# Dashboard:  http://localhost:1881/dashboard

services:
  node-red:
    build: ./node-red
    image: pdp-node-red:local
    restart: unless-stopped
    ports:
      # 1881 zodat je bestaande Node-RED op 1880 blijft werken
      - "127.0.0.1:1881:1880"
    environment:
      TZ: Europe/Brussels
    volumes:
      - node-red-data:/data

volumes:
  # Flows en instellingen blijven bewaard bij herstarten/herbouwen.
  # Het dashboard zit in de image, niet in dit volume.
  node-red-data:
